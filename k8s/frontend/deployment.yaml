apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopverse
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: mohamedsaabith342/shopverse-frontend:22915c8e872a8c8788f8f74918bbdefad90132c0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

      