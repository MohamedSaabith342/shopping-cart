apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopverse
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: mohamedsaabith342/shopverse-backend:38d8b7e67836db016a7c9df6e509a0ca6204723d

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          